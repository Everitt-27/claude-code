# PostgreSQL for local development.
#
# The application does not require Docker — with no DATABASE_URL set the server
# falls back to an in-memory store and everything still runs, including the
# browser tests. Docker is here so that persistence, snapshots and reload
# recovery can be exercised the way they will be in production.

services:
  postgres:
    image: postgres:16-alpine
    container_name: corrigible-postgres
    environment:
      POSTGRES_USER: corrigible
      POSTGRES_PASSWORD: corrigible
      POSTGRES_DB: corrigible_town
    ports:
      - "5432:5432"
    volumes:
      - corrigible-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corrigible -d corrigible_town"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The whole application in one container, serving the API and the built web
  # client from a single origin. Started only with `--profile app`, so the
  # default `docker compose up` still just brings up the database for local
  # development against `make dev`.
  app:
    profiles: ["app"]
    build:
      context: .
    container_name: corrigible-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://corrigible:corrigible@postgres:5432/corrigible_town
      CT_BIND: 0.0.0.0:8787
      # Set this before exposing the container beyond your own machine.
      CT_ACCESS_TOKEN: ${CT_ACCESS_TOKEN:-}
    ports:
      - "8787:8787"

volumes:
  corrigible-pgdata:
